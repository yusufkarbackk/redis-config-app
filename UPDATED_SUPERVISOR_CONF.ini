; ==============================================================
; Updated Redis Stream Supervisor Configuration
; ==============================================================
; This replaces your existing supervisor.conf
;
; Changes Made:
; 1. Separate workers for stream-insert and stream-update queues
; 2. Removed redis-stream-listener (now handled by queue workers)
; 3. Updated queue names to match new architecture
; 4. Adjusted process counts for better resource management

; ==============================================================
; 1) Redis Stream Insert Workers
; ==============================================================
[program:redis-stream-insert]
process_name=%(program_name)s_%(process_num)02d
numprocs=2
command=php /var/www/html/redis-config-app/artisan queue:work redis --queue=stream-insert --sleep=1 --tries=3 --timeout=60
directory=/var/www/html/redis-config-app
user=www-data
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/www/html/redis-config-app/storage/logs/redis-stream-insert.log
stderr_logfile=/var/www/html/redis-config-app/storage/logs/redis-stream-insert-error.log

; ==============================================================
; 2) Redis Stream Update Workers
; ==============================================================
[program:redis-stream-update]
process_name=%(program_name)s_%(process_num)02d
numprocs=2
command=php /var/www/html/redis-config-app/artisan queue:work redis --queue=stream-update --sleep=1 --tries=3 --timeout=60
directory=/var/www/html/redis-config-app
user=www-data
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/www/html/redis-config-app/storage/logs/redis-stream-update.log
stderr_logfile=/var/www/html/redis-config-app/storage/logs/redis-stream-update-error.log

; ==============================================================
; 3) Legacy Redis Queue Workers (for other redis queues if needed)
; ==============================================================
[program:redis-queue-worker]
process_name=%(program_name)s_%(process_num)02d
numprocs=2
command=php /var/www/html/redis-config-app/artisan queue:work redis --queue=redis --sleep=3 --tries=3 --timeout=60
directory=/var/www/html/redis-config-app
user=www-data
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/www/html/redis-config-app/storage/logs/redis-queue-worker.log
stderr_logfile=/var/www/html/redis-config-app/storage/logs/redis-queue-worker-error.log

; ==============================================================
; 4) Redis Stream Listeners (Optional - if you still need custom listeners)
; ==============================================================
; Note: The new architecture doesn't require separate stream listeners
; as the queue workers handle both stream consumption and job processing.
; Remove this section if you don't need custom listeners.

; [program:redis-stream-listener]
; process_name=%(program_name)s_%(process_num)02d
; numprocs=1
; command=php /var/www/html/redis-config-app/artisan stream:listen
; directory=/var/www/html/redis-config-app
; user=www-data
; autostart=false  ; Set to false unless you specifically need this
; autorestart=true
; startsecs=5
; stdout_logfile=/var/www/html/redis-config-app/storage/logs/redis-stream-listener.log
; stderr_logfile=/var/www/html/redis-config-app/storage/logs/redis-stream-listener-error.log